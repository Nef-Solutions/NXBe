# Tema de Overol: fuerza modo claro aunque el navegador/SO esté en modo oscuro.
# Esto elimina la necesidad de forzar colores con !important en el CSS.
[theme]
base = "light"
primaryColor = "#F59E0B"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
# Borde de campos, selectores, fecha, números, expanders y contenedores: gris azulado con
# contraste 3,6:1 sobre blanco (antes casi blanco); el foco sigue usando primaryColor.
borderColor = "#7C8899"
showWidgetBorder = true
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# Evita límites raros al subir documentos de verificación (el tope real se valida en el código: 5 MB)
maxUploadSize = 10
