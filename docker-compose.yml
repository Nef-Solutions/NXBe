# Overol completo en Docker: base de datos + backend (Django) + front (Streamlit).
#
#   docker compose up --build          levanta todo (modo desarrollo, con recarga automática)
#   docker compose up db backend       solo la base y la API (para quien trabaja el front)
#   docker compose up db               solo la base (para quien trabaja el backend con venv)
#
# Al lado está docker-compose.override.yml, que Docker Compose aplica solo: monta el código
# para ver los cambios al guardar. Para probar las imágenes tal como se publican:
#   docker compose -f docker-compose.yml up --build
#
# Instrucciones completas en DOCKER.md.

# Mismo nombre que backend/docker-compose.yml: así las dos formas de trabajo comparten
# el contenedor y el volumen de la base (no se pierden los datos al cambiar de una a otra).
name: overol-backend

include:
  - backend/docker-compose.yml   # servicio "db" (PostgreSQL + PostGIS)

services:
  backend:
    build: ./backend
    image: overol-backend
    container_name: overol_backend
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
    environment:
      # Dentro de Docker la base se llama por el nombre del servicio, no "localhost"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # "backend" es el nombre con el que el front llama a la API por la red interna
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
    ports:
      - "8000:8000"
    volumes:
      # Archivos subidos (fotos, certificaciones y cédulas): sobreviven a reinicios y rebuilds
      - media_data:/app/media
      - private_media_data:/app/private_media
    depends_on:
      db:
        condition: service_healthy

  front:
    build: "./overol-front"
    image: overol-front
    container_name: overol_front
    restart: unless-stopped
    environment:
      # El front habla con la API por la red interna de Docker. Para usar un backend que
      # corre fuera de Docker: OVEROL_API_URL=http://host.docker.internal:8000/api/
      OVEROL_API_URL: ${OVEROL_API_URL:-http://backend:8000/api/}
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  media_data:
  private_media_data:
